server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de Nginx.
    server_tokens off;

    # ── Cabeceras de seguridad ────────────────────────────────────────────────
    # CSP afinada para DocLab: todo se sirve desde el propio origen. Se permiten
    # blob: (worker de pdf.js) y data:/blob: en imágenes (canvas.toDataURL,
    # object URLs de previsualización). 'unsafe-inline' solo en estilos por los
    # style attributes inline de React; NUNCA en scripts.
    # 'wasm-unsafe-eval' permite COMPILAR WebAssembly propio (qpdf-wasm para cifrado);
    # NO habilita eval() de JS — sigue siendo seguro.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS: solo lo respetan los navegadores sobre HTTPS (el túnel de Cloudflare
    # termina TLS). En HTTP local se ignora, sin efectos secundarios.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compresión.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # ── Reverse-proxy de la API al backend (red interna de Docker) ────────────
    # El navegador habla solo con Nginx (mismo origen → sin CORS). El backend
    # (solo el proxy de búsqueda con IA) nunca se expone al túnel.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las conversiones de Office pueden tardar.
        proxy_read_timeout 90s;
        client_max_body_size 60m;
    }

    # ── Activos con hash: cache larga e inmutable ─────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # OJO (footgun de Nginx): al declarar un add_header aquí, se PIERDEN todos los
        # add_header heredados del bloque server. Hay que repetir las cabeceras de
        # seguridad para que también las lleve el JS/WASM con hash — incluido el
        # worker de seguridad (secureWasm.worker), que necesita 'wasm-unsafe-eval'
        # para compilar qpdf-wasm, y 'nosniff' para que el navegador no adivine tipos.
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
